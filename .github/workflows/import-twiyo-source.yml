name: Import TwiYo source archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/run-twiyo-source-import"
      - ".github/workflows/import-twiyo-source.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: twiyo-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4

      - name: Validate and unpack uploaded source archive
        id: unpack
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          import shutil
          import stat
          import tempfile
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          archive_path = root / "TwiYo_GitHub_Import_Package.zip"
          if not archive_path.is_file():
              raise SystemExit(
                  "Upload TwiYo_GitHub_Import_Package.zip to the repository root first."
              )

          temp_dir = Path(tempfile.mkdtemp(prefix="twiyo-import-"))
          try:
              with ZipFile(archive_path) as archive:
                  entries = archive.infolist()
                  if not entries:
                      raise SystemExit("The source archive is empty.")
                  for item in entries:
                      normalized = item.filename.replace("\\", "/")
                      path = PurePosixPath(normalized)
                      mode = item.external_attr >> 16
                      if path.is_absolute() or any(part == ".." for part in path.parts):
                          raise SystemExit(f"Unsafe archive path rejected: {item.filename}")
                      if stat.S_ISLNK(mode):
                          raise SystemExit(f"Symbolic link rejected: {item.filename}")
                  archive.extractall(temp_dir)
          except BadZipFile as exc:
              raise SystemExit(f"Invalid ZIP archive: {exc}") from exc

          required = [
              "package.json",
              "pnpm-lock.yaml",
              "client/src/App.tsx",
              "scripts/quality-gate.mjs",
          ]
          missing = [name for name in required if not (temp_dir / name).is_file()]
          if missing:
              raise SystemExit("Archive is not the expected TwiYo source package; missing: " + ", ".join(missing))
          if (temp_dir / ".git").exists():
              raise SystemExit("Archive must not contain a .git directory.")

          for source in temp_dir.iterdir():
              destination = root / source.name
              if source.is_dir():
                  shutil.copytree(source, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(source, destination)

          # The GitHub runner token cannot push a workflow-file change without the
          # separate "workflows" permission. The repository CI workflow is provisioned
          # independently through the contents API, so normalize the bundled copy to
          # match that pre-provisioned file before creating the source PR.
          ci_workflow = root / ".github" / "workflows" / "demo-quality.yml"
          if ci_workflow.is_file():
              ci_content = ci_workflow.read_text(encoding="utf-8")
              ci_content = ci_content.replace("  push:\\n    branches: [main]\\n", "")
              ci_content = ci_content.replace("          cache: pnpm\\n", "")
              ci_workflow.write_text(ci_content, encoding="utf-8")

          archive_path.unlink()
          file_count = sum(1 for path in root.rglob("*") if path.is_file() and ".git" not in path.parts)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"file_count={file_count}\n")
          print(f"Validated and unpacked TwiYo source. Files in workspace: {file_count}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Verify demo boundaries and routes
        id: demo_quality
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm quality:demo

      - name: Type-check
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm check

      - name: Run unit tests
        id: unit_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm test

      - name: Build static preview
        id: static_build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build:static

      - name: Open a pull request with the populated source tree
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: bootstrap/import-twiyo-source
          delete-branch: true
          add-paths: .
          commit-message: "chore: import TwiYo source and demo quality gate"
          title: "Import TwiYo source and demo quality gate"
          body: |
            ## Source import
            This pull request unpacks the reviewed TwiYo source package into the repository.

            - Adds the application source, assets, scripts, tests, and project documentation.
            - Removes the temporary ZIP import package.
            - Preserves the repository's bootstrap importer so future manual imports remain possible.
            - Runs the available dependency-backed checks on the GitHub runner; review their results below before merging.

            This is still a demo. Payments, durable order storage, live enquiry delivery, and production business operations are not enabled by this import.

      - name: Summarize import and verification results
        if: always()
        env:
          FILE_COUNT: ${{ steps.unpack.outputs.file_count }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          DEMO_RESULT: ${{ steps.demo_quality.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          TEST_RESULT: ${{ steps.unit_tests.outcome }}
          BUILD_RESULT: ${{ steps.static_build.outcome }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          COMPARE_URL: https://github.com/looloofy69-sketch/TwiYo/compare/main...bootstrap/import-twiyo-source?expand=1
        run: |
          {
            echo "## TwiYo source import"
            echo "- Files in imported workspace: ${FILE_COUNT:-unknown}"
            echo "- Dependency installation: ${INSTALL_RESULT:-not run}"
            echo "- Demo quality gate: ${DEMO_RESULT:-skipped}"
            echo "- TypeScript check: ${TYPECHECK_RESULT:-skipped}"
            echo "- Unit tests: ${TEST_RESULT:-skipped}"
            echo "- Static build: ${BUILD_RESULT:-skipped}"
            if [ -n "${PR_URL:-}" ]; then
              echo "- Pull request: ${PR_URL}"
            else
              echo "- Pull request was not created automatically. If the source branch was pushed, create a pull request here: ${COMPARE_URL}"
            fi
            echo
            echo "Verification steps are allowed to fail independently so the import PR can still be reviewed. Do not merge until failures are understood."
          } >> "$GITHUB_STEP_SUMMARY"
