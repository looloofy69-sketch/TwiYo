name: Resolve browser test dependencies

on:
  push:
    branches:
      - audit/demo-hardening-2026-10
    paths:
      - ".github/resolve-browser-tests.trigger"

permissions:
  contents: write

concurrency:
  group: twiyo-browser-test-deps
  cancel-in-progress: false

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v7
        with:
          ref: audit/demo-hardening-2026-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false

      - name: Install and lock browser-test dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium and Linux browser dependencies
        id: browser
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright flows and axe checks
        id: e2e
        continue-on-error: true
        run: pnpm test:e2e

      - name: Run all-severity production dependency audit
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level=low

      - name: Run demo quality gate
        id: quality
        continue-on-error: true
        run: pnpm quality:demo

      - name: Type-check application and browser tests
        id: typecheck
        continue-on-error: true
        run: pnpm check

      - name: Run unit tests
        id: unit
        continue-on-error: true
        run: pnpm test

      - name: Build static preview
        id: build
        continue-on-error: true
        run: pnpm build:static

      - name: Commit resolved dependency lock
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No package or lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m "test: lock browser testing dependencies"
          git push origin HEAD:refs/heads/audit/demo-hardening-2026-10

      - name: Summarize browser and build evidence
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          {
            echo "## TwiYo browser-test dependency run"
            echo "- Browser installation: ${BROWSER:-not run}"
            echo "- Playwright journeys and axe scans: ${E2E:-not run}"
            echo "- Production dependency audit: ${AUDIT:-not run}"
            echo "- Demo quality gate: ${QUALITY:-not run}"
            echo "- TypeScript including test specs: ${TYPECHECK:-not run}"
            echo "- Unit tests: ${UNIT:-not run}"
            echo "- Static build: ${BUILD:-not run}"
            echo
            echo "Axe scans fail on serious/critical WCAG tagged violations. The logs include all detected axe findings. This smoke gate is not a WCAG conformance certification."
          } >> "$GITHUB_STEP_SUMMARY"
